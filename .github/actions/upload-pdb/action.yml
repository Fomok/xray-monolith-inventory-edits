inputs:
  toolchain:
    required: true
  target:
    required: true
  avx:
    required: true
  build-preset:
    required: true

env: 
  avx-segment: ${{inputs.avx && '.AVX' || ''}}

runs:
  using: composite
  steps:
      uses: actions/upload-artifact@v4.6.0
      env: 
        target: ${{inputs.target}}
        toolchain: ${{inputs.toolchain}}${{env.avx-segment}}
        avx-name: ${{inputs.avx && 'AVX' || ''}}
      with:
        name: ${{inputs.target}}${{env.avx-segment}}.PDB
        path: ${{github.workspace}}/_build/${{env.toolchain}}/Binaries/${{env.build-preset}}/${{env.target}}${{env.avx-name}}.exe
        if-no-files-found: "error"
        retention-days: 1