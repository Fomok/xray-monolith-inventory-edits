name: AMP-Build

on:
  push:
    branches: [ "amp-hooks-mt", "feature/ui-render-depth" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  build:
    name: DX11-AVX and gamedata
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Pack gamedata
      working-directory: compressor
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path ./gamedata | Out-Null
        Copy-Item -Path ../gamedata/* -Destination ./gamedata -Recurse -Force
        $packer = Start-Process -FilePath "./! compress_gamedata.cmd" -WindowStyle Hidden -Wait -PassThru
        if ($packer.ExitCode -ne 0) { throw "gamedata packing failed: $($packer.ExitCode)" }
        if (!(Test-Path -LiteralPath ./gamedata.db0 -PathType Leaf)) { throw "gamedata.db0 was not produced" }
        Rename-Item -LiteralPath ./gamedata.db0 -NewName $env:PACK_GAMEDATA_NAME

    - name: Build DX11-AVX
      run: msbuild /p:Configuration=DX11-AVX $env:SOLUTION_FILE_PATH

    - name: Stage install package
      run: |
        $ErrorActionPreference = "Stop"
        $files = @(
          @{ Source = "./_build/_game/bin_dbg/AnomalyDX11AVX.exe"; Target = "./package/bin/AnomalyDX11AVX.exe" },
          @{ Source = "./_build/_game/bin_dbg/AnomalyDX11AVX.pdb"; Target = "./package/bin/AnomalyDX11AVX.pdb" },
          @{ Source = "./compressor/$env:PACK_GAMEDATA_NAME"; Target = "./package/db/mods/$env:PACK_GAMEDATA_NAME" }
        )
        foreach ($file in $files) {
          if (!(Test-Path -LiteralPath $file.Source -PathType Leaf)) { throw "Missing required file: $($file.Source)" }
          if ((Get-Item -LiteralPath $file.Source).Length -eq 0) { throw "Empty required file: $($file.Source)" }
        }
        foreach ($file in $files) {
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $file.Target) | Out-Null
          Copy-Item -LiteralPath $file.Source -Destination $file.Target
        }
        Get-ChildItem -LiteralPath ./package -Recurse -File | Select-Object FullName, Length

    # GitHub downloads this directory as one ZIP, with bin/ and db/ at its root.
    - name: Upload install ZIP
      uses: actions/upload-artifact@v4.6.0
      with:
        name: Squared-Away-DX11-AVX
        path: ./package/
        if-no-files-found: error
        retention-days: 7
