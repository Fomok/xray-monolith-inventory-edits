name: SQA-Personal-DLSS-FG-Test

on:
  push:
    branches: [ "personal-bodycam-dlss-frame-generation" ]
    paths-ignore:
      - 'tools/optiscaler/**'
      - '.github/workflows/personal-optiscaler.yml'
      - '.github/workflows/personal-menu-probe.yml'
      - 'tools/dlss/bridge_probe.cpp'
      - 'tools/dlss/fg_inputs_test.cpp'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  gamedata:
    name: Pack matching gamedata
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
    - name: Pack gamedata
      working-directory: compressor
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path ./gamedata | Out-Null
        Copy-Item -Path ../gamedata/* -Destination ./gamedata -Recurse -Force
        $packer = Start-Process -FilePath "./! compress_gamedata.cmd" -WindowStyle Hidden -Wait -PassThru
        if ($packer.ExitCode -ne 0) { throw "gamedata packing failed: $($packer.ExitCode)" }
        if (!(Test-Path -LiteralPath ./gamedata.db0 -PathType Leaf)) { throw "gamedata.db0 was not produced" }
        if ((Get-Item -LiteralPath ./gamedata.db0).Length -eq 0) { throw "gamedata.db0 is empty" }
        New-Item -ItemType Directory -Force -Path ../stage/db/mods | Out-Null
        Copy-Item -LiteralPath ./gamedata.db0 -Destination "../stage/db/mods/$env:PACK_GAMEDATA_NAME"
    - uses: actions/upload-artifact@v4.6.0
      with:
        name: amp-bodycam-gamedata
        path: ./stage/
        if-no-files-found: error
        retention-days: 1

  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [DX11-AVX]
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"
    - name: Check temporal math and native HUD selection
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($test in @("temporal_test", "pda_depth_test", "sampler_test", "camera_mv_test")) {
          msbuild "tools/dlss/$test.vcxproj" /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "$test build failed" }
          & "./_build/dlss_tests/$test.exe"
          if ($LASTEXITCODE -ne 0) { throw "$test failed" }
        }
    - name: Compile hardware bridge probe
      run: |
        msbuild tools/dlss/bridge_probe.vcxproj /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force -Path ./stage/bin | Out-Null
        Copy-Item ./_build/dlss_tests/bridge_probe.exe ./stage/bin/
        msbuild tools/dlss/fg_inputs_test.vcxproj /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item ./_build/dlss_tests/fg_inputs_test.exe ./stage/bin/
    - name: Stage signed Streamline runtime
      run: |
        $ErrorActionPreference = "Stop"
        Invoke-WebRequest "https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.16/streamline-sdk-v2.14.16.zip" -OutFile streamline.zip
        if ((Get-FileHash streamline.zip -Algorithm SHA256).Hash -ne "32041E51DB0CAB709A271B72A352281B690C2ABBD669A827809401A5DD23956B") { throw "Streamline SDK hash mismatch" }
        Expand-Archive streamline.zip ./streamline-download
        New-Item -ItemType Directory -Force -Path ./stage/bin/streamline,./stage/licenses | Out-Null
        foreach ($dll in @("sl.interposer.dll","sl.common.dll","sl.dlss_g.dll","sl.reflex.dll","sl.pcl.dll","nvngx_dlssg.dll")) {
          $source = "./streamline-download/bin/x64/$dll"
          $signature = Get-AuthenticodeSignature $source
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "NVIDIA") { throw "Untrusted runtime: $dll" }
          Copy-Item $source ./stage/bin/streamline/
        }
        Copy-Item ./sdk/Streamline/license.txt ./stage/licenses/Streamline.txt
        Copy-Item ./sdk/Streamline/3rd-party-licenses.md ./stage/licenses/Streamline-third-party.md
        Copy-Item ./sdk/Streamline/nvngx_dlss.license.txt ./stage/licenses/NVIDIA-DLSS-FG.txt
        Copy-Item ./sdk/Streamline/reflex.license.txt ./stage/licenses/NVIDIA-Reflex.txt
    - uses: actions/upload-artifact@v4.6.0
      with:
        name: personal-fg-runtime-probe
        path: ./stage/
        if-no-files-found: error
        retention-days: 7
    - name: Build executable
      env:
        BUILD_CONFIGURATION: ${{ matrix.configuration }}
      run: |
        msbuild /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=x64 $env:SOLUTION_FILE_PATH
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Stage executable and symbols
      env:
        BUILD_CONFIGURATION: ${{ matrix.configuration }}
      run: |
        $ErrorActionPreference = "Stop"
        $stem = "Anomaly" + $env:BUILD_CONFIGURATION.Replace("-", "")
        New-Item -ItemType Directory -Force -Path ./stage/bin | Out-Null
        foreach ($ext in @("exe", "pdb")) {
          $source = "./_build/_game/bin_dbg/$stem.$ext"
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing required file: $source" }
          if ((Get-Item -LiteralPath $source).Length -eq 0) { throw "Empty required file: $source" }
          Copy-Item -LiteralPath $source -Destination ./stage/bin/
        }
    - name: Stage verified NVIDIA runtime and licenses
      run: |
        $ErrorActionPreference = "Stop"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/NVIDIA/DLSS/v310.9.1/lib/Windows_x86_64/rel/nvngx_dlss.dll" -OutFile ./stage/bin/nvngx_dlss.dll
        $expected = "3975567B8943C53ACCE397F2B72380092F84F162D00B0D2C7D08A1025C563983"
        if ((Get-FileHash ./stage/bin/nvngx_dlss.dll -Algorithm SHA256).Hash -ne $expected) { throw "NVIDIA runtime checksum mismatch" }
        New-Item -ItemType Directory -Force -Path ./stage/licenses | Out-Null
        Copy-Item -LiteralPath ./sdk/DLSS/LICENSE.txt -Destination ./stage/licenses/NVIDIA-DLSS.txt
        Copy-Item -LiteralPath ./sdk/FSR3/LICENSE.txt -Destination ./stage/licenses/AMD-FidelityFX.txt
    - uses: actions/upload-artifact@v4.6.0
      with:
        name: amp-bodycam-${{ matrix.configuration }}
        path: ./stage/
        if-no-files-found: error
        retention-days: 1

  package:
    name: Package Bodycam compatibility build
    needs: [build, gamedata]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: amp-bodycam-*
        merge-multiple: true
        path: ./incoming
    - name: Validate and stage complete install package
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($file in @("bin/AnomalyDX11AVX.exe", "bin/AnomalyDX11AVX.pdb", "db/mods/00_modded_exes_gamedata.db0")) {
          $source = Join-Path ./incoming $file
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing required file: $file" }
          if ((Get-Item -LiteralPath $source).Length -eq 0) { throw "Empty required file: $file" }
        }
        New-Item -ItemType Directory -Force -Path ./package | Out-Null
        Copy-Item -Path ./incoming/* -Destination ./package -Recurse -Force
        New-Item -ItemType Directory -Force -Path ./package/docs | Out-Null
        Copy-Item -LiteralPath ./License.txt,./THIRD-PARTY-NOTICES.txt,./README.md -Destination ./package/
        Copy-Item -LiteralPath ./docs/DISTRIBUTION.md,./docs/PROVENANCE.md,./docs/PERSONAL-FG-PROVENANCE.md,./docs/PERSONAL-FG-TEST4-VALIDATION.md -Destination ./package/docs/
        Copy-Item -LiteralPath ./docs/PERSONAL-FG-DUAL-FPS-VALIDATION.md -Destination ./package/docs/
        Copy-Item -LiteralPath ./docs/PERSONAL-FG-TEST.txt -Destination "./package/READ ME FIRST.txt"
        New-Item -ItemType Directory -Force -Path ./package/tools | Out-Null
        Copy-Item -LiteralPath ./tools/dlss/prepare-optiscaler-personal.ps1 -Destination ./package/tools/
        $manifest = @{ commit = $env:GITHUB_SHA; upstream = "65faa2f0"; configuration = "DX11-AVX"; files = @() }
        Get-ChildItem ./package -File -Recurse | ForEach-Object {
          $manifest.files += @{ path = [IO.Path]::GetRelativePath((Resolve-Path ./package), $_.FullName).Replace("\", "/"); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
        }
        $manifest | ConvertTo-Json -Depth 5 | Set-Content ./package/build-manifest.json -Encoding utf8
    # Download this artifact for one ZIP with bin/ and db/ at its root.
    - uses: actions/upload-artifact@v4.6.0
      with:
        name: Squared-Away-Personal-DLSS-FG-Test-6-PiP-DX11-AVX
        path: ./package/
        if-no-files-found: error
        retention-days: 14
