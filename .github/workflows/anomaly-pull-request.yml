name: Pull Request

on:
  - pull_request
  - workflow_dispatch

# Cancel previous run if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

env:
  packed-gamedata: 00_modded_exes_gamedata.db0

jobs:
  anomaly:
    name: Anomaly
    runs-on: windows-latest
    environment: Anomaly.PullRequest
    steps:
      - run: echo "Building Anomaly"
  
  # Compilation subcategory
  compile:
    name: Compile
    needs: anomaly
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compiling..."

  # Compilation jobs
  binaries:
    name: Binaries

    runs-on: windows-latest
    needs: compile

    strategy:
      matrix:
        configure-preset:
          - 'MSVS.MSVC.Ninja'
          - 'MSVS.MSVC.Ninja.AVX'
          - 'System.Clang'
          - 'System.Clang.AVX'
         #- 'System.GNU'
         #- 'System.GNU.AVX'
        target:
          - 'Anomaly.DX8'
          - 'Anomaly.DX9'
          - 'Anomaly.DX10'
          - 'Anomaly.DX11'

    env:
      configure-preset: ${{matrix.configure-preset}}
      build-preset: 'RelWithDebInfo'
      target: ${{matrix.target}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure build environment
      uses: ./.github/actions/setup-env

    - name: Build Binary
      uses: ./.github/actions/cmake
    
    - name: Upload Binary
      uses: ./.github/actions/upload-binary
    
    - name: Upload PDB
      uses: ./.github/actions/upload-pdb
  
  # Packing subcategory
  pack:
    name: Pack
    needs: anomaly
    runs-on: ubuntu-latest
    steps:
      - run: echo "Packing..."

  # Packing jobs
  gamedata:
    name: Gamedata
    needs: pack
    
    runs-on: windows-latest

    env:
      configure-preset: 'MSVS.MSVC.Ninja.AVX'
      build-preset: 'RelWithDebInfo'
      target: 'Gamedata'
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure build environment
      uses: ./.github/actions/setup-env
    
    - name: Build Gamedata
      uses: ./.github/actions/build-gamedata
    
    - name: Upload Gamedata
      uses: ./.github/actions/upload-gamedata
  
  # Checking subcategory
  check:
    name: Check
    needs: anomaly
    runs-on: ubuntu-latest
    steps:
      - run: echo "Checking..."

  # Checking jobs
  check-spacing:
    name: Check Spacing
    needs: check

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Spacing
      uses: ./.github/actions/check-spacing
    
    - name: Report Results
      uses: ./.github/actions/check-result
      with:
        message-ok: Spacing OK
        message-error: "Incorrect spacing"

  check-encoding:
    name: Check Style
    needs: check

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Encoding
      uses: ./.github/actions/check-encoding
    
    - name: Report Results
      uses: ./.github/actions/check-result
      with:
        message-ok: Encoding OK
        message-error: "Incorrect encoding"
